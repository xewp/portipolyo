<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta name="description" content="{{SITE_TITLE}}. Thoughtful digital experiences, considered design, and hands-on development. Explore selected projects and get in touch." />
    <meta name="author" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SHARE_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:image" content="{{SHARE_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="{{SITE_URL}}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>{{SITE_TITLE}}</title>
    <script>(function(){try{var t=localStorage.getItem('portfolio-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}catch(e){}})()</script>
  </head>
  <body id="top">
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
